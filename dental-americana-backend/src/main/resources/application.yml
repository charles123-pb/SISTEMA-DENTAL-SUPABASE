server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: dental-americana-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dental_americana}
    username: ${DB_USER:dental_admin}
    password: ${DB_PASSWORD:dental_dev_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  clinic:
    zone-id: ${CLINIC_ZONE_ID:America/Lima}
  whatsapp:
    enabled: ${WHATSAPP_ENABLED:false}
    graph-base-url: ${WHATSAPP_GRAPH_BASE_URL:https://graph.facebook.com/v21.0}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    app-secret: ${WHATSAPP_APP_SECRET:}
    webhook-verify-token: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:${WHATSAPP_WEBHOOK_SECRET:change-this-secret}}
    default-country-code: ${WHATSAPP_DEFAULT_COUNTRY_CODE:51}
    template-language: ${WHATSAPP_TEMPLATE_LANGUAGE:es_PE}
    max-attempts: ${WHATSAPP_MAX_ATTEMPTS:3}
    outbox-delay-ms: ${WHATSAPP_OUTBOX_DELAY_MS:30000}
    reminder-scan-delay-ms: ${WHATSAPP_REMINDER_SCAN_DELAY_MS:300000}
    templates:
      appointment-confirmation: ${WHATSAPP_TEMPLATE_APPOINTMENT_CONFIRMATION:}
      appointment-reminder: ${WHATSAPP_TEMPLATE_APPOINTMENT_REMINDER:}
      follow-up: ${WHATSAPP_TEMPLATE_FOLLOW_UP:}
  jwt:
    secret: ${JWT_SECRET:ZGVudGFsLWFtZXJpY2FuYS1kZXNhcnJvbGxvLXNlY3Vyby0yMDI2LTA4LTI5}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:4200}
  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    username: ${APP_ADMIN_USERNAME:admin}
    password: ${APP_ADMIN_PASSWORD:}
    full-name: ${APP_ADMIN_FULL_NAME:Administrador Dental Americana}
  storage:
    patient-files-root: ${PATIENT_FILES_ROOT:./storage/patients}
    patient-files-max-bytes: ${PATIENT_FILES_MAX_BYTES:10485760}
