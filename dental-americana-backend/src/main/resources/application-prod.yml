spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  flyway:
    locations: classpath:db/migration

server:
  forward-headers-strategy: framework

management:
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS}
  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    username: ${APP_ADMIN_USERNAME:admin}
    password: ${APP_ADMIN_PASSWORD:}
    full-name: ${APP_ADMIN_FULL_NAME:Odontólogo Dental Americana}
  whatsapp:
    webhook-verify-token: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN}
