services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-dental_americana}
      POSTGRES_USER: ${DB_USER:-dental_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dental_admin} -d ${DB_NAME:-dental_americana}"]
      interval: 5s
      timeout: 5s
      retries: 15
    volumes: [dental_pgdata:/var/lib/postgresql/data]
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-384m}
  backend:
    build: .
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=70 -XX:+UseSerialGC}
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-dental_americana}
      DB_USER: ${DB_USER:-dental_admin}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en .env}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en .env}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost}
      CLINIC_ZONE_ID: ${CLINIC_ZONE_ID:-America/Lima}
      BOOTSTRAP_ADMIN_ENABLED: ${BOOTSTRAP_ADMIN_ENABLED:-false}
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:-admin}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-}
      APP_ADMIN_FULL_NAME: ${APP_ADMIN_FULL_NAME:-Administrador Dental Americana}
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
      WHATSAPP_GRAPH_BASE_URL: ${WHATSAPP_GRAPH_BASE_URL:-https://graph.facebook.com/v21.0}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-${WHATSAPP_WEBHOOK_SECRET:-change-this-secret}}
      WHATSAPP_DEFAULT_COUNTRY_CODE: ${WHATSAPP_DEFAULT_COUNTRY_CODE:-51}
      WHATSAPP_TEMPLATE_LANGUAGE: ${WHATSAPP_TEMPLATE_LANGUAGE:-es_PE}
      WHATSAPP_TEMPLATE_APPOINTMENT_CONFIRMATION: ${WHATSAPP_TEMPLATE_APPOINTMENT_CONFIRMATION:-}
      WHATSAPP_TEMPLATE_APPOINTMENT_REMINDER: ${WHATSAPP_TEMPLATE_APPOINTMENT_REMINDER:-}
      WHATSAPP_TEMPLATE_FOLLOW_UP: ${WHATSAPP_TEMPLATE_FOLLOW_UP:-}
      PATIENT_FILES_ROOT: /app/storage/patients
    volumes: [dental_files:/app/storage/patients]
    mem_limit: ${BACKEND_MEMORY_LIMIT:-512m}
  frontend:
    build: ../dental-americana-frontend
    restart: unless-stopped
    depends_on: [backend]
    ports: ["${WEB_PORT:-80}:80"]
    mem_limit: ${FRONTEND_MEMORY_LIMIT:-96m}
volumes:
  dental_pgdata:
  dental_files:
