services:
  postgres:
    image: postgres:16-alpine
    container_name: dental-americana-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-dental_americana}
      POSTGRES_USER: ${DB_USER:-dental_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dental_dev_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dental_admin} -d ${DB_NAME:-dental_americana}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - dental_pgdata:/var/lib/postgresql/data

volumes:
  dental_pgdata:
