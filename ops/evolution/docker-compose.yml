services:
  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: dental-evolution-api
    restart: unless-stopped
    depends_on:
      evolution-postgres:
        condition: service_healthy
      evolution-redis:
        condition: service_started
    ports:
      - "8080:8080"
    # Usa el DNS de la red local para que los webhooks HTTPS de Supabase
    # no dependan del resolver embebido de Docker.
    dns:
      - 192.168.137.1
    environment:
      NODE_OPTIONS: --dns-result-order=ipv4first
    extra_hosts:
      - "cnwnecyodyxoszvmfxuc.supabase.co:172.64.149.246"
    env_file:
      - .env
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - evolution-net

  evolution-postgres:
    image: postgres:15-alpine
    container_name: dental-evolution-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution-local-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - evolution_postgres:/var/lib/postgresql/data
    networks:
      - evolution-net

  evolution-redis:
    image: redis:7-alpine
    container_name: dental-evolution-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - evolution_redis:/data
    networks:
      - evolution-net

volumes:
  evolution_instances:
  evolution_postgres:
  evolution_redis:

networks:
  evolution-net:
